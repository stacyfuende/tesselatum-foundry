[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tessellatum-foundry"
version = "0.1.0"
description = "Contracts and deterministic spatial computation infrastructure for Tessellatum Foundry."
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.26,<5",
  "referencing>=0.36,<1",
  "pyproj>=3.7,<4",
]

[project.scripts]
foundry = "tessellatum_foundry.cli:main"

[project.optional-dependencies]
dev = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<0.28",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
shapely = [
  "shapely>=2.0,<3",
]
postgis = [
  "psycopg[binary]>=3.2,<4",
]
raster = [
  "numpy>=1.26,<3",
  "rasterio>=1.4,<2",
]
api = [
  "fastapi>=0.115,<1",
  "shapely>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/tessellatum-foundry/schema" = ["schema/*.schema.json"]
"share/tessellatum-foundry/capabilities/vector.buffer" = ["capabilities/vector.buffer/1.0.0.json"]
"share/tessellatum-foundry/capabilities/vector.reproject" = ["capabilities/vector.reproject/1.0.0.json"]
"share/tessellatum-foundry/capabilities/raster.band_statistics" = ["capabilities/raster.band_statistics/1.0.0.json"]
"share/tessellatum-foundry/implementations/vector.buffer/shapely" = ["implementations/vector.buffer/shapely/1.0.0.json"]
"share/tessellatum-foundry/implementations/vector.buffer/postgis" = ["implementations/vector.buffer/postgis/1.0.0.json"]
"share/tessellatum-foundry/implementations/vector.reproject/pyproj-shapely" = ["implementations/vector.reproject/pyproj-shapely/1.0.0.json"]
"share/tessellatum-foundry/implementations/raster.band_statistics/rasterio" = ["implementations/raster.band_statistics/rasterio/1.0.0.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP"]
