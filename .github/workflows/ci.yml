name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "README*"
      - "LICENSE*"
  workflow_dispatch:

concurrency:
  group: foundry-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts-and-conformance:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.7
        env:
          POSTGRES_DB: foundry
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d foundry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FOUNDRY_POSTGIS_DSN: postgresql://postgres:postgres@localhost:5432/foundry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install project and development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium for customer browser tests
        run: python -m playwright install --with-deps chromium
      - name: Run Foundry pre-production certification
        run: python scripts/preproduction_certify.py --profile ci

  live-external-raster:
    name: Live external Nairobi Sentinel-2 raster execution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Foundry runtime
        run: python -m pip install -e . shapely
      - name: Execute real external raster smoke test
        run: python scripts/live_external_raster_smoke.py
